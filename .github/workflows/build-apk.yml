name: Build PyBot APK

# 云端打包 PyBot 的 Android APK（Flet 壳 + bot/）。
#
# 触发方式（二选一）：
#   1. 打 tag 并推送：git tag v0.1.0 && git push origin v0.1.0
#      （tag 必须以 v 开头；版本号取自 tag）
#   2. 手动触发：Actions 页选本 workflow → Run workflow → 填版本号（v0.1.0，
#      带不带 v 都可以）。
#
# 注意：本文件需用带 workflow 权限的 token 推送（GitHub App 没有 workflows
# 权限，用 App 推会返回 403）。
#
# 流程照抄 pmvault 的 build-apk job（Flutter 3.44.8、JDK 17、Android SDK），
# 只改三处：工程在 apk/ 子目录（构建步骤里 cd apk）、自检换成 bot 的导入+
# 问答、签名 Secrets 沿用同一套名字（目标仓库里需另行配置）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, e.g. v0.1.0 (with or without leading v)"
        required: true
        default: "v0.1.0"
        type: string

env:
  FLUTTER_VERSION: "3.44.8"
  FLET_VERSION: "1.0.4"
  PYTHON_VERSION: "3.12"
  JDK_DIR: "17.0.13+11"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.version }}"; fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Build tag: $TAG (version ${TAG#v})"

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存 Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter/${{ env.FLUTTER_VERSION }}
          key: flutter-${{ env.FLUTTER_VERSION }}

      - name: 缓存 JDK
        uses: actions/cache@v4
        with:
          path: ~/java/${{ env.JDK_DIR }}
          key: jdk-${{ env.JDK_DIR }}

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-sdk
          key: android-sdk-v1

      - name: 安装 Flutter SDK
        run: |
          DIR="$HOME/flutter/$FLUTTER_VERSION"
          if [ -x "$DIR/bin/flutter" ]; then
            echo "Flutter 已缓存，跳过安装"
          else
            mkdir -p "$HOME/flutter"
            URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            echo "下载 $URL"
            curl -fL --retry 3 -o /tmp/flutter.tar.xz "$URL"
            tar -xJf /tmp/flutter.tar.xz -C "$HOME/flutter"
            mv "$HOME/flutter/flutter" "$DIR"
            rm -f /tmp/flutter.tar.xz
          fi
          "$DIR/bin/flutter" --version

      - name: 安装 JDK 17
        run: |
          DIR="$HOME/java/$JDK_DIR"
          if [ -x "$DIR/bin/javac" ]; then
            echo "JDK 已缓存，跳过安装"
          else
            mkdir -p "$HOME/java"
            URL="https://api.adoptium.net/v3/binary/version/jdk-${JDK_DIR//+/%2B}/linux/x64/jdk/hotspot/normal/eclipse"
            echo "下载 $URL"
            curl -fL --retry 3 -o /tmp/jdk.tar.gz "$URL"
            mkdir -p /tmp/jdkx
            tar -xzf /tmp/jdk.tar.gz -C /tmp/jdkx
            inner=$(ls /tmp/jdkx | head -1)
            mv "/tmp/jdkx/$inner" "$DIR"
            rm -rf /tmp/jdk.tar.gz /tmp/jdkx
          fi
          export JAVA_HOME="$DIR"
          # 必须写进 GITHUB_ENV：runner 镜像自带 JAVA_HOME（2026-11 起默认 JDK 25），
          # 不覆盖的话，没自己 export 的步骤（如「预检」）会拿到 25，而 Flet 要求 17 → 预检失败。
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "PATH=$JAVA_HOME/bin:$PATH" >> "$GITHUB_ENV"
          "$DIR/bin/javac" -version

      - name: 安装 Android SDK（含 Flet 要求的基础包）
        run: |
          export JAVA_HOME="$HOME/java/$JDK_DIR"
          export PATH="$JAVA_HOME/bin:$PATH"
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            curl -fL --retry 3 -o /tmp/cmdline.zip "$URL"
            unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -f /tmp/cmdline.zip
          fi
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platform-tools" "platforms;android-35" "build-tools;34.0.0"
          echo "--- 校验 Flet 要求的路径 ---"
          for p in cmdline-tools/latest/bin/sdkmanager platform-tools "platforms/android-35" "build-tools/34.0.0"; do
            if [ -e "$ANDROID_HOME/$p" ]; then echo "  OK   $p"; else echo "  缺失 $p"; exit 1; fi
          done

      - name: 装 Flet CLI 与依赖
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==${{ env.FLET_VERSION }}"

      - name: 自检：bot 能否导入、一轮问答是否正常
        run: |
          cd apk/src
          python -c "import time; t=time.time(); from bot import runtime; print('导入 OK，用时 %.1fs' % (time.time()-t)); print('回复:', runtime.reply('hi', {}))"

      - name: 预检：确认 Flet 不会再弹交互提示
        run: |
          # 双保险：即使 GITHUB_ENV 没生效，这一步也显式指向 JDK 17
          export JAVA_HOME="$HOME/java/$JDK_DIR"
          export PATH="$JAVA_HOME/bin:$PATH"
          python apk/precheck_ci.py

      - name: 还原签名密钥（从 Secrets）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，将使用调试签名（能装但不适合长期升级）"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.p12
            ls -l upload-keystore.p12
          fi

      - name: Flutter 预热（首次要下载大量引擎/依赖，单独限时便于定位）
        timeout-minutes: 12
        continue-on-error: true
        run: |
          export PATH="$HOME/flutter/$FLUTTER_VERSION/bin:$PATH"
          mkdir -p diagnose
          timeout 600 flutter precache --android --no-ios 2>&1 | tee diagnose/precache.log || echo "预热超时或失败（继续）"

      - name: 构建 APK（失败时立即自收集诊断）
        timeout-minutes: 40
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/upload-keystore.p12
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set +e
          export JAVA_HOME="$HOME/java/$JDK_DIR"
          export PATH="$HOME/flutter/$FLUTTER_VERSION/bin:$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p diagnose
          echo "JAVA_HOME=$JAVA_HOME" | tee diagnose/env.log
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a diagnose/env.log
          echo "flutter=$(command -v flutter)" | tee -a diagnose/env.log
          if [ ! -f upload-keystore.p12 ]; then
            unset FLET_ANDROID_SIGNING_KEY_STORE FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD \
                  FLET_ANDROID_SIGNING_KEY_PASSWORD FLET_ANDROID_SIGNING_KEY_ALIAS
          fi
          collect() {
            {
              echo "=== 退出码: $1 ==="
              echo "=== java ==="; "$HOME/java/$JDK_DIR/bin/java" -version 2>&1
              echo "=== flutter ==="; "$HOME/flutter/$FLUTTER_VERSION/bin/flutter" --version 2>&1
              echo "=== flet ==="; flet --version 2>&1
              echo "=== 工程树 ==="
              find apk -maxdepth 3 -not -path '*/__pycache__/*' -not -path '*/build/*' | sort | head -30
              echo "=== build 目录 ==="; find apk/build -maxdepth 4 -type d 2>/dev/null | head -40
              echo "=== 工程配置 ==="; cat apk/pyproject.toml
            } >> diagnose/env.log 2>&1
            echo "诊断已写入 diagnose/env.log"
            ls -la diagnose/
          }
          trap 'collect $?' EXIT
          cd apk
          timeout 2100 flet build apk --verbose --build-version "${{ steps.version.outputs.version }}" --build-number "${{ github.run_number }}" > ../diagnose/build.log 2>&1
          code=$?
          cd ..
          echo "构建退出码: $code"
          echo "$code" > diagnose/build_exit_code.txt
          if [ "$code" -ne 0 ]; then
            echo "--- build.log 末尾 120 行 ---"
            tail -120 diagnose/build.log
            echo "::error::flet build 失败，退出码 $code（124=超时）"
            exit "$code"
          fi
          echo "构建成功"
          find apk/build -name "*.apk" -exec ls -lh {} \;

      - name: 上传诊断日志（无论成败）
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pybot-build-diagnostics-apk
          path: diagnose/
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pybot-apk
          path: apk/build/**/*.apk
          if-no-files-found: error
          retention-days: 30
